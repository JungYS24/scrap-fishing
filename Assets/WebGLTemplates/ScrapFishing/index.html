<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scrap Fishing">
    <meta name="theme-color" content="#0b1220">
    <meta name="format-detection" content="telephone=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading">
        <div id="unity-title">SCRAP FISHING</div>
        <div id="unity-progress-track">
          <div id="unity-progress-bar"></div>
        </div>
        <div id="unity-progress-label">0%</div>
      </div>
      <div id="unity-warning"></div>
      <div id="boot-error" hidden>
        <p>게임을 불러오지 못했습니다.</p>
        <p id="boot-error-detail"></p>
      </div>
    </div>
    <button type="button" id="fs-button" aria-label="전체화면" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M7 3H3v4h2V5h2V3zm10 0v2h2v2h2V3h-4zM5 17H3v4h4v-2H5v-2zm16 0h-2v2h-2v2h4v-4z"/>
      </svg>
    </button>
    <div id="inapp-banner" hidden>
      <p>인앱 브라우저에서는 전체화면이 제한될 수 있습니다. 외부 브라우저로 열면 더 잘 플레이할 수 있습니다.</p>
      <a id="inapp-open" hidden>외부 브라우저로 열기</a>
      <button type="button" id="inapp-close">닫기</button>
    </div>
    <div id="ios-install" hidden>
      <p>공유 → 홈 화면에 추가하면 전체화면으로 플레이</p>
      <button type="button" id="ios-install-close" aria-label="닫기">닫기</button>
    </div>
    <div id="rotate-hint">세로로 돌려 주세요</div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var bar = document.querySelector("#unity-progress-bar");
      var label = document.querySelector("#unity-progress-label");
      var bootError = document.querySelector("#boot-error");
      var bootDetail = document.querySelector("#boot-error-detail");
      var shell = document.querySelector("#unity-container");
      var fsButton = document.querySelector("#fs-button");
      var inappBanner = document.querySelector("#inapp-banner");
      var inappOpen = document.querySelector("#inapp-open");
      var iosInstall = document.querySelector("#ios-install");
      var iosInstallTimer = 0;
      var fsUnlocked = false;

      function fitShell() {
        var vv = window.visualViewport;
        var width = Math.round(vv ? vv.width : window.innerWidth);
        var height = Math.round(vv ? vv.height : window.innerHeight);
        document.documentElement.style.setProperty("--app-width", width + "px");
        document.documentElement.style.setProperty("--app-height", height + "px");
        if (shell && vv) {
          shell.style.left = Math.round(vv.offsetLeft) + "px";
          shell.style.top = Math.round(vv.offsetTop) + "px";
        }
      }

      function fullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }

      function canRequestFullscreen() {
        var root = document.documentElement;
        return typeof (root.requestFullscreen || root.webkitRequestFullscreen) === "function";
      }

      function lockPortrait() {
        try {
          if (screen.orientation && screen.orientation.lock) {
            var pending = screen.orientation.lock("portrait");
            if (pending && pending.catch) {
              pending.catch(function () {});
            }
          }
        } catch (err) {}
      }

      function updateFullscreenButton() {
        if (!fsButton) {
          return;
        }
        var show = canRequestFullscreen() && !fullscreenElement();
        fsButton.hidden = !show;
      }

      function enterFullscreen(fromButton) {
        if (fullscreenElement() || !canRequestFullscreen()) {
          return;
        }
        if (fsUnlocked && !fromButton) {
          return;
        }
        var root = document.documentElement;
        var request = root.requestFullscreen || root.webkitRequestFullscreen;
        var pending;
        try {
          pending = request.call(root, { navigationUI: "hide" });
        } catch (err) {
          return;
        }
        if (pending && pending.then) {
          pending.then(function () {
            if (fullscreenElement()) {
              fsUnlocked = true;
            }
            lockPortrait();
          }).catch(function () {});
        }
      }

      function onFullscreenChange() {
        if (fullscreenElement()) {
          fsUnlocked = true;
          lockPortrait();
        }
        fitShell();
        updateFullscreenButton();
      }

      function isOverlayEvent(event) {
        var target = event.target;
        if (!target || !target.closest) {
          return false;
        }
        return !!target.closest("#fs-button, #inapp-banner, #ios-install");
      }

      function onUserActivate(event) {
        if (isOverlayEvent(event) || fsUnlocked) {
          return;
        }
        window.setTimeout(function () {
          enterFullscreen(false);
        }, 0);
      }

      function blockUnityPassThrough(element) {
        if (!element) {
          return;
        }
        ["pointerdown", "pointerup", "pointermove", "touchstart", "touchend", "touchmove", "click", "mousedown", "mouseup"].forEach(function (type) {
          element.addEventListener(type, function (event) {
            event.stopPropagation();
          });
        });
      }

      function inAppKind() {
        var ua = navigator.userAgent || "";
        if (/KAKAOTALK/i.test(ua)) {
          return "kakao";
        }
        if (/Instagram/i.test(ua)) {
          return "instagram";
        }
        if (/NAVER/i.test(ua)) {
          return "naver";
        }
        return "";
      }

      function isIosSafari() {
        var ua = navigator.userAgent || "";
        var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (!ios || /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua) || inAppKind()) {
          return false;
        }
        return /WebKit/i.test(ua);
      }

      function isStandalone() {
        return navigator.standalone === true;
      }

      function showInAppBanner() {
        var kind = inAppKind();
        if (!kind || !inappBanner) {
          return;
        }
        inappBanner.hidden = false;
        if (kind === "kakao" && inappOpen) {
          inappOpen.hidden = false;
          inappOpen.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(window.location.href);
        }
      }

      function showIosInstallHint() {
        if (!iosInstall || !isIosSafari() || isStandalone()) {
          return;
        }
        iosInstall.hidden = false;
        iosInstallTimer = window.setTimeout(hideIosInstallHint, 4000);
      }

      function hideIosInstallHint() {
        if (iosInstallTimer) {
          window.clearTimeout(iosInstallTimer);
          iosInstallTimer = 0;
        }
        if (iosInstall) {
          iosInstall.hidden = true;
        }
      }

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        var div = document.createElement("div");
        div.textContent = msg;
        div.className = type === "error" ? "banner-error" : "banner-warning";
        warningBanner.appendChild(div);
        warningBanner.style.display = "block";
        if (type !== "error") {
          setTimeout(function () {
            if (div.parentNode) {
              warningBanner.removeChild(div);
            }
            if (!warningBanner.children.length) {
              warningBanner.style.display = "none";
            }
          }, 5000);
        }
      }

      function showBootError(message) {
        loading.style.display = "none";
        bootError.hidden = false;
        bootDetail.textContent = message || "잠시 후 다시 시도해 주세요.";
      }

      fitShell();
      updateFullscreenButton();
      showInAppBanner();
      window.addEventListener("resize", fitShell);
      if (window.visualViewport) {
        visualViewport.addEventListener("resize", fitShell);
        visualViewport.addEventListener("scroll", fitShell);
      }
      document.addEventListener("gesturestart", function (event) { event.preventDefault(); });
      document.addEventListener("contextmenu", function (event) { event.preventDefault(); });
      document.addEventListener("pointerup", onUserActivate);
      document.addEventListener("touchend", onUserActivate, { passive: true });
      document.addEventListener("fullscreenchange", onFullscreenChange);
      document.addEventListener("webkitfullscreenchange", onFullscreenChange);

      blockUnityPassThrough(fsButton);
      blockUnityPassThrough(inappBanner);
      blockUnityPassThrough(iosInstall);
      if (fsButton) {
        fsButton.addEventListener("click", function (event) {
          event.preventDefault();
          enterFullscreen(true);
        });
      }
      var inappClose = document.querySelector("#inapp-close");
      if (inappClose) {
        inappClose.addEventListener("click", function () {
          inappBanner.hidden = true;
        });
      }
      var iosClose = document.querySelector("#ios-install-close");
      if (iosClose) {
        iosClose.addEventListener("click", hideIosInstallHint);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner
      };

      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#else
      canvas.style.background = "{{{ BACKGROUND_COLOR }}}";
#endif

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var percent = Math.round(100 * progress);
          bar.style.width = percent + "%";
          label.textContent = percent + "%";
        }).then(function () {
          loading.style.display = "none";
          showIosInstallHint();
        }).catch(function (message) {
          showBootError(message);
        });
      };
      script.onerror = function () {
        showBootError("로더를 받지 못했습니다. 네트워크를 확인해 주세요.");
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
